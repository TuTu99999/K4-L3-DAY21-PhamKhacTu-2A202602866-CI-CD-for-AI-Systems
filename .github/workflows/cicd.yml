name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cicd.yml'
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Amazon S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          region = credentials.get("aws_region", "ap-southeast-1")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              print(f"AWS_ACCESS_KEY_ID={credentials['aws_access_key_id']}", file=env_file)
              print(f"AWS_SECRET_ACCESS_KEY={credentials['aws_secret_access_key']}", file=env_file)
              print(f"AWS_DEFAULT_REGION={region}", file=env_file)
              print(f"AWS_REGION={region}", file=env_file)
              if credentials.get("aws_session_token"):
                  print(f"AWS_SESSION_TOKEN={credentials['aws_session_token']}", file=env_file)
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload candidate to Amazon S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          prefix = f"artifacts/candidates/{os.environ['GITHUB_SHA']}"
          s3.upload_file("models/model.joblib", bucket, f"{prefix}/model.joblib")
          for filename in os.listdir("outputs"):
              s3.upload_file(
                  os.path.join("outputs", filename),
                  bucket,
                  f"{prefix}/evaluation/{filename}",
              )
          print(f"Uploaded candidate to s3://{bucket}/{prefix}/")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install rollback dependency
        run: pip install boto3==1.35.24

      - name: Authenticate to Amazon S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          region = credentials.get("aws_region", "ap-southeast-1")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              print(f"AWS_ACCESS_KEY_ID={credentials['aws_access_key_id']}", file=env_file)
              print(f"AWS_SECRET_ACCESS_KEY={credentials['aws_secret_access_key']}", file=env_file)
              print(f"AWS_DEFAULT_REGION={region}", file=env_file)
              print(f"AWS_REGION={region}", file=env_file)
          PYEOF

      - name: Check F1 and rollback gates
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import boto3
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")

          s3 = boto3.client("s3")
          try:
              response = s3.get_object(
                  Bucket=os.environ["ARTIFACT_BUCKET"],
                  Key="artifacts/current/report.json",
              )
              old_f1 = float(json.loads(response["Body"].read())["f1_score"])
          except ClientError as error:
              if error.response["Error"]["Code"] not in ("NoSuchKey", "404"):
                  raise
              old_f1 = -1.0

          if f1 < old_f1:
              raise SystemExit(
                  f"ROLLBACK: candidate F1 {f1:.4f} < current F1 {old_f1:.4f}. "
                  "Giu nguyen model hien tai."
              )
          print(
              f"PASSED: candidate F1 {f1:.4f} >= 0.65 and "
              f">= current F1 {old_f1:.4f}."
          )
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install release dependency
        run: pip install boto3==1.35.24

      - name: Authenticate to Amazon S3
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          region = credentials.get("aws_region", "ap-southeast-1")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              print(f"AWS_ACCESS_KEY_ID={credentials['aws_access_key_id']}", file=env_file)
              print(f"AWS_SECRET_ACCESS_KEY={credentials['aws_secret_access_key']}", file=env_file)
              print(f"AWS_DEFAULT_REGION={region}", file=env_file)
              print(f"AWS_REGION={region}", file=env_file)
          PYEOF

      - name: Promote candidate model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          prefix = f"artifacts/candidates/{os.environ['GITHUB_SHA']}"
          for source, destination in (
              (f"{prefix}/model.joblib", "artifacts/current/model.joblib"),
              (f"{prefix}/evaluation/report.json", "artifacts/current/report.json"),
          ):
              s3.copy_object(
                  Bucket=bucket,
                  CopySource={"Bucket": bucket, "Key": source},
                  Key=destination,
              )
          print("Promoted candidate model and report to artifacts/current/")
          PYEOF

      - name: Copy serving code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py"
          target: "/home/ubuntu"
          overwrite: true

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
